name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Hoot.app
        run: ./Scripts/build_app.sh
      - name: Smoke test
        run: ./build/Hoot.app/Contents/MacOS/Hoot --smoke-test
      - name: Package DMG
        run: ./Scripts/package_dmg.sh
      - name: Upload DMG to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.dmg --clobber
      - name: Upload DMG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hoot-dmg
          path: dist/*.dmg
